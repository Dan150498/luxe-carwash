{% extends "base.html" %}

{% block title %}Record Wash - Luxe Carwash{% endblock %}

{% block content %}
<div class="card">
    <h2>Record New Wash</h2>

    <form method="POST">
        <!-- Registration Number -->
        <div class="form-group">
            <label>Car Registration Number</label>
            <input type="text" name="registration" required placeholder="e.g. KDE 801F" style="text-transform: uppercase;">
        </div>

        <!-- Staff -->
        <div class="form-group">
            <label>Staff who washed the car</label>
            <select name="staff_id" required style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                <option value="">-- Select Staff --</option>
                {% for s in staff %}
                    <option value="{{ s.staff_id }}">{{ s.full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Vehicle Type -->
        <div class="form-group">
            <label>Vehicle Type</label>
            <select name="vehicle_type_id" id="vehicle_type" required style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                <option value="">-- Select Vehicle Type --</option>
                {% for v in vehicle_types %}
                    <option value="{{ v.vehicle_type_id }}">{{ v.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Services -->
        <div class="form-group">
            <label>Select Services</label>
            <div id="services-list" style="background:#111; border:1px solid #333; border-radius:6px; padding:15px; min-height:60px;">
                <p style="color:#888;">Please select a vehicle type first...</p>
            </div>
        </div>

        <!-- Payment Section -->
        <div class="form-group">
           <label style="color:#d4af37; margin-bottom:10px; display:block;">Payment Breakdown</label>
    
            <div style="display:flex; gap:15px; flex-wrap:wrap;">
                <div style="flex:1; min-width:140px;">
                    <label>Cash (KSh)</label>
                    <input type="number" name="cash_amount" id="cash_amount" value="0" min="0"
                           style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
            </div>
            <div style="flex:1; min-width:140px;">
                <label>M-Pesa (KSh)</label>
                <input type="number" name="mpesa_amount" id="mpesa_amount" value="0" min="0"
                       style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
            </div>
        </div>
        <p style="color:#888; font-size:0.85rem; margin-top:8px;">
            Cash + M-Pesa must equal the Total Amount
        </p>
    </div>

<script>
    // When vehicle type changes, load available services
    document.getElementById('vehicle_type').addEventListener('change', function() {
        const vehicleId = this.value;
        const servicesDiv = document.getElementById('services-list');

        if (!vehicleId) {
            servicesDiv.innerHTML = '<p style="color:#888;">Please select a vehicle type first...</p>';
            return;
        }

        fetch(`/get-services/${vehicleId}`)
            .then(response => response.json())
            .then(data => {
                if (data.length === 0) {
                    servicesDiv.innerHTML = '<p style="color:#ff6b6b;">No prices set for this vehicle type.</p>';
                    return;
                }

                let html = '';
                data.forEach(service => {
                    html += `
                        <label style="display:block; margin-bottom:10px; cursor:pointer;">
                            <input type="checkbox" name="services" value="${service.service_id}" 
                                   data-amount="${service.amount}" style="margin-right:10px;">
                            ${service.name} — <span style="color:#d4af37;">KSh ${service.amount}</span>
                        </label>
                    `;
                });
                servicesDiv.innerHTML = html;
            });
    });
</script>
{% endblock %}
