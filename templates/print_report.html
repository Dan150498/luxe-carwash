<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luxe Carwash - Staff Earnings Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #111;
        }
        h1 {
            color: #b8960c;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px 12px;
            text-align: left;
        }
        th {
            background: #f5f5f5;
        }
        .total {
            margin-top: 25px;
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
        }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <h1>LUXE CARWASH</h1>
    <p class="subtitle">Staff Earnings Report</p>
    <p style="text-align:center;">Period: <strong>{{ start_date }}</strong> to <strong>{{ end_date }}</strong></p>

    <table>
        <thead>
            <tr>
                <th>Staff Name</th>
                <th>Total Washes</th>
                <th>Total Earned (KSh)</th>
            </tr>
        </thead>
        <tbody>
            {% for r in results %}
            <tr>
                <td>{{ r.full_name }}</td>
                <td>{{ r.total_washes }}</td>
                <td>{{ r.total_earned }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="total">
        Grand Total: KSh {{ grand_total }}
    </div>

    <div class="no-print" style="text-align:center; margin-top:40px;">
        <button onclick="window.print()" style="padding:10px 25px; font-size:1rem; cursor:pointer;">
            Print / Save as PDF
        </button>
    </div>

    <script>
        // Optional: automatically open print dialog
        // window.onload = function() { window.print(); }
    </script>
</body>
</html>
