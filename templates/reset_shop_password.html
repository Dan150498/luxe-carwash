{% extends "base.html" %}
{% block title %}Reset Password - {{ shop.name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <h2>Reset Admin Password</h2>
    <p style="color:#888;">Shop: <strong>{{ shop.name }}</strong></p>
    <form method="POST">
        <div class="form-group">
            <label>Admin user</label>
            <select name="user_id" required style="width:100%; padding:12px; background:#111; color:#fff; border:1px solid #333; border-radius:6px;">
                {% for a in admins %}
                <option value="{{ a.user_id }}">{{ a.full_name }} ({{ a.username }})</option>
                {% else %}
                <option value="">No admin users</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>New temporary password</label>
            <input type="text" name="new_password" required minlength="6"
                   style="width:100%; padding:12px; background:#111; color:#fff; border:1px solid #333; border-radius:6px;">
        </div>
        <button type="submit" class="btn">Reset Password</button>
        <a href="{{ url_for('platform_dashboard') }}" class="btn" style="background:#333;">Cancel</a>
    </form>
</div>
{% endblock %}
