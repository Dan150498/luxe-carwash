<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Luxe Carwash</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div style="text-align:center; margin-bottom:20px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" 
                alt="Luxe Carwash" 
                style="width:70px; height:70px; object-fit:contain; margin-bottom:10px;"
                onerror="this.style.display='none'">
            <h1 style="color:#d4af37; letter-spacing:3px; margin:0;">LUXE CARWASH</h1>
            <p style="color:#888; margin-top:5px;">Management System</p>
        </div>
        <div class="login-box">
            <h1>LUXE CARWASH</h1>
            <p class="subtitle">Premium Car Care System</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-block">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
