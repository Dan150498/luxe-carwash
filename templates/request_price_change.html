{% extends "base.html" %}

{% block title %}Request Price Change - Luxe Carwash{% endblock %}

{% block content %}
<div class="card" style="max-width:600px;">
    <h2>Request Price Change</h2>
    <p style="color:#888; margin-bottom:25px;">Submit a new price. Admin must approve before it becomes active.</p>

    <form method="POST">
        <div class="form-group">
            <label>Vehicle Type</label>
            <select name="vehicle_type_id" required
                    style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                <option value="">-- Select Vehicle --</option>
                {% for v in vehicle_types %}
                    <option value="{{ v.vehicle_type_id }}">{{ v.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Service</label>
            <select name="service_id" required
                    style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                <option value="">-- Select Service --</option>
                {% for s in services %}
                    <option value="{{ s.service_id }}">{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>New Price (KSh)</label>
            <input type="number" name="requested_amount" required min="0"
                   style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
        </div>

        <button type="submit" class="btn">Submit Request</button>
    </form>
</div>
{% endblock %}
