{% extends "base.html" %}

{% block title %}Change Password - Luxe Carwash{% endblock %}

{% block content %}
<div class="card" style="max-width:500px; margin:0 auto;">
    <h2>Change Password</h2>
    <p style="color:#888; margin-bottom:25px;">Enter your current password and choose a new one.</p>

    <form method="POST">
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" required
                   style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" required minlength="6"
                   style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
        </div>

        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required minlength="6"
                   style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
        </div>

        <button type="submit" class="btn btn-block">Change Password</button>
    </form>
</div>
{% endblock %}
