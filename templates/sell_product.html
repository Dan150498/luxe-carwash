{% extends "base.html" %}

{% block title %}Sell Product - Luxe Carwash{% endblock %}

{% block content %}
<div class="card" style="max-width:550px;">
    <h2>Sell Product</h2>

    <form method="POST">
        <div class="form-group">
            <label>Product</label>
            <select name="product_id" id="product_select" required
                    style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                <option value="">-- Select Product --</option>
                {% for p in products %}
                    <option value="{{ p.product_id }}" data-price="{{ p.selling_price }}" data-stock="{{ p.stock_qty }}">
                        {{ p.name }} — KSh {{ p.selling_price }} (Stock: {{ p.stock_qty }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <input type="number" name="quantity" id="quantity" value="1" min="1" required
                   style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
        </div>

        <div class="form-group">
            <label>Total Amount</label>
            <input type="text" id="total_display" value="KSh 0" readonly
                   style="width:100%; padding:12px; background:#222; color:#d4af37; border:1px solid #333; border-radius:6px; font-weight:600;">
        </div>

        <div class="form-group">
            <label style="color:#d4af37;">Payment</label>
            <div style="display:flex; gap:15px;">
                <div style="flex:1;">
                    <label>Cash</label>
                    <input type="number" name="cash_amount" value="0" min="0"
                           style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                </div>
                <div style="flex:1;">
                    <label>M-Pesa</label>
                    <input type="number" name="mpesa_amount" value="0" min="0"
                           style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                </div>
            </div>
        </div>

        <button type="submit" class="btn">Complete Sale</button>
    </form>
</div>

<script>
    function updateTotal() {
        const select = document.getElementById('product_select');
        const qty = parseInt(document.getElementById('quantity').value) || 0;
        const option = select.options[select.selectedIndex];
        const price = parseInt(option.getAttribute('data-price')) || 0;
        document.getElementById('total_display').value = 'KSh ' + (price * qty);
    }
    document.getElementById('product_select').addEventListener('change', updateTotal);
    document.getElementById('quantity').addEventListener('input', updateTotal);
</script>
{% endblock %}
