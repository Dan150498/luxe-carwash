{% extends "base.html" %}

{% block title %}Sell Product - Luxe Carwash{% endblock %}

{% block content %}
<div class="card" style="max-width:550px;">
    <h2>Sell Product</h2>

    <form method="POST">
        <div class="form-group">
            <label>Product</label>
            <select name="product_id" id="product_select" required
                    style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                <option value="">-- Select Product --</option>
                {% for p in products %}
                    <option value="{{ p.product_id }}" 
                            data-price="{{ p.selling_price }}" 
                            data-stock="{{ p.stock_qty }}">
                        {{ p.name }} — KSh {{ p.selling_price }} (Stock: {{ p.stock_qty }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <input type="number" name="quantity" id="quantity" value="1" min="1" required
                   style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
        </div>

        <div class="form-group">
            <label>Agreed Amount (KSh)</label>
            <input type="number" name="agreed_amount" id="agreed_amount" required
                   placeholder="Type the agreed amount"
                   style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
            <p id="min-price-msg" style="color:#888; font-size:0.85rem; margin-top:6px;">
                Select a product first
            </p>
        </div>

        <div class="form-group">
            <label style="color:#d4af37;">Payment Breakdown</label>
            <div style="display:flex; gap:15px; flex-wrap:wrap; margin-top:8px;">
                <div style="flex:1; min-width:140px;">
                    <label>Cash (KSh)</label>
                    <input type="number" name="cash_amount" value="0" min="0"
                           style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                </div>
                <div style="flex:1; min-width:140px;">
                    <label>M-Pesa (KSh)</label>
                    <input type="number" name="mpesa_amount" value="0" min="0"
                           style="width:100%; padding:12px; background:#111; color:white; border:1px solid #333; border-radius:6px;">
                </div>
            </div>
            <p style="color:#888; font-size:0.85rem; margin-top:8px;">
                Cash + M-Pesa must equal the agreed amount
            </p>
        </div>

        <button type="submit" class="btn">Complete Sale</button>
        <a href="{{ url_for('cashier_home') }}" class="btn" style="background:#333; margin-left:10px;">Cancel</a>
    </form>
</div>

<script>
function updateMinPrice() {
    const select = document.getElementById('product_select');
    const qtyInput = document.getElementById('quantity');
    const agreedInput = document.getElementById('agreed_amount');
    const minMsg = document.getElementById('min-price-msg');

    const option = select.options[select.selectedIndex];
    const price = parseInt(option.getAttribute('data-price')) || 0;
    const stock = parseInt(option.getAttribute('data-stock')) || 0;
    let qty = parseInt(qtyInput.value) || 1;

    // Limit quantity to available stock
    if (qty > stock) {
        qty = stock;
        qtyInput.value = stock;
    }

    const minTotal = price * qty;

    // Only show the minimum — do not force the value
    minMsg.innerHTML = `Minimum allowed: <strong style="color:#d4af37;">KSh ${minTotal}</strong>. You can type a higher amount if negotiated.`;
    
    // Set the HTML min attribute for browser validation
    agreedInput.min = minTotal;
    
    // If the field is empty, suggest the minimum (but user can still type over it)
    if (!agreedInput.value) {
        agreedInput.placeholder = minTotal;
    }
}

document.getElementById('product_select').addEventListener('change', updateMinPrice);
document.getElementById('quantity').addEventListener('input', updateMinPrice);
</script>
{% endblock %}
